apply plugin: 'com.bmuschko.docker-remote-api'



//war.archiveName("nsl#services##${rootProject.version}.war")
war {
    archiveFileName = "nsl#services-tomcat.war"
    // developmentOnly leaks into the war through runtimeClasspath; devtools has
    // no business in a deployable war and restarts the app on redeploy.
    rootSpec.exclude '**/spring-boot-devtools-*.jar'
}
bootWar {
    archiveFileName = "nsl#services.war"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
//    maven { url "https://dl.bintray.com/nerderg/plugins" }
//    maven {
//        url "https://oss.jfrog.org/artifactory/oss-snapshot-local"
//    }
//    maven { url "https://dl.bintray.com/bio-org-au/plugins" }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

