//    implementation 'org.ysb33r.gradle:grolifant:0.9'
//    implementation 'org.ysb33r.gradle:grolifant60:4.0.0'
}


springBoot { mainClass = 'services3.Application' }

bootRun {
    ignoreExitValue true
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-noverify',
            '-XX:TieredStopAtLevel=1',
            '-Xmx2G',
            '-Xms2G')
    //environment "nsl_services_config", "${projectDir.absolutePath}/etc/nsl/services-config-g3.groovy"
//    addResources = true
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperty "geb.env", System.getProperty('geb.env')
    systemProperty "geb.build.reportsDir", reporting.file("geb/integrationTest")
    systemProperty "webdriver.chrome.driver", System.getProperty('webdriver.chrome.driver')
    systemProperty "webdriver.gecko.driver", System.getProperty('webdriver.gecko.driver')
}

bootJar.enabled = true

// NOTE: do not set assets.packagePlugin=true here - it is for library/plugin
// projects and makes the build skip asset precompilation. Without
// precompilation the war ships raw assets with no manifest, so in production
// asset-pipeline serves everything with Cache-Control: no-cache and
// ?compile=false URLs (see AssetPipelineFilter).

asciidoctor {
    sourceDir = file("docs")
    sources {
        include "index.adoc"
    }

    resources {
        from("$sourceDir/resources/images")
        into './resources/images'
    }

    attributes 'source-highlighter': 'coderay',
            toc: '',
            idprefix: '',
            idseparator: '-'

    outputDir = file("build/docs")
}


buildProperties {
    inputs.property("info.app.build.date", new Date().format('yyyy-MM-dd HH:mm:ss'))
}


// ---------------------------------------------------------------------------
// Docker image
//
// The image runs the *container* war (the plain servlet war that expects an
// external Tomcat), not the executable bootWar. Dockerfile at the project root
// is the single source of truth; the build copies it plus that one war into a
// small context directory so the daemon doesn't have to receive the whole
// 300MB build/ tree.
// ---------------------------------------------------------------------------

// The AWS ECR repo `ibis-docker` holds every image we publish, so the image name
// goes in the *tag* (e.g. apache-latest, ruby-3.4.8-rails-8.1.0), not the path.
// Override the whole registry/repo with -PdockerRepo=<uri>.
def dockerImageName = 'nsl-services'
def dockerBuildDir = layout.buildDirectory.dir('docker')
def dockerRepo = project.findProperty('dockerRepo') ?: '420181724456.dkr.ecr.ap-southeast-2.amazonaws.com/ibis-docker'

task dockerContext(type: Sync, dependsOn: war) {
    description = 'Assemble a minimal Docker build context (Dockerfile + war)'
    group = 'Docker'
    into dockerBuildDir
    from(project.projectDir) {
        include 'Dockerfile'
    }
    from(layout.buildDirectory.dir('libs')) {
        include 'nsl#services-tomcat.war'
        into 'build/libs'
    }
}

task buildDockerImage(type: DockerBuildImage, dependsOn: dockerContext) {
    description = 'Build the nsl-services Tomcat Docker image'
    group = 'Docker'
    inputDir = dockerBuildDir
    // Local names
    images.add("${dockerImageName}:${version}")
    images.add("${dockerImageName}:latest")
    // Registry tags: <repo>:<image>-<version>
    images.add("${dockerRepo}:${dockerImageName}-${version}")
    images.add("${dockerRepo}:${dockerImageName}-latest")
}

task dockerPublish(type: DockerPushImage, dependsOn: buildDockerImage) {
    description = 'Push the nsl-services image to the configured registry'
    group = 'Docker'
    images.add("${dockerRepo}:${dockerImageName}-${version}")
    images.add("${dockerRepo}:${dockerImageName}-latest")
}
